<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyce Ann Bingo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Name Entry Modal -->
  <div id="name-modal" class="modal-overlay">
    <div class="modal">
      <h2>Welcome to Joyce Ann Bingo!</h2>
      <p>Enter your name to get started:</p>
      <input type="text" id="name-input" placeholder="Your name" maxlength="30" autocomplete="off">
      <button id="name-submit" class="btn btn-primary">Let's Play!</button>
    </div>
  </div>

  <!-- Bingo Celebration Modal -->
  <div id="bingo-modal" class="modal-overlay hidden">
    <div class="modal bingo-celebration">
      <div id="confetti-container"></div>
      <h2 id="bingo-message">BINGO! 🎉</h2>
      <p>You did it!</p>
      <button id="bingo-close" class="btn btn-primary">Keep Playing</button>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="hidden">
    <header>
      <h1>Joyce Ann Bingo</h1>
      <p id="player-display" class="player-name"></p>
    </header>

    <div class="toolbar">
      <button id="btn-copy-link" class="btn btn-secondary">📋 Copy Game Link</button>
      <button id="btn-new-game" class="btn btn-secondary">🎲 New Game</button>
      <button id="btn-reset" class="btn btn-secondary">🔄 Reset Board</button>
    </div>

    <div id="bingo-board" class="board"></div>

    <div class="toolbar">
      <button id="btn-call-bingo" class="btn btn-primary btn-large">📣 Call Bingo!</button>
    </div>

    <footer>
      <p>Share the link so everyone plays the same board!</p>
    </footer>
  </div>

  <div id="toast" class="toast hidden">Link copied!</div>

  <script src="app.js"></script>
</body>
</html>
